name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref; there is no value in
# testing a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: the Go release that CI validates must be the
  # one developers and the Dockerfile use, or CI stops being evidence.
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Check go.mod is tidy
        run: make tidy-check

      - name: Vet
        run: make vet

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The race detector is not optional for Atlas: the scheduler, event bus,
      # and lifecycle supervisor are all concurrent, and a data race in any of
      # them corrupts the observations the platform exists to produce.
      - name: Test with the race detector
        run: make test

      - name: Coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml. TimescaleDB is a hard requirement of
        # migration 0001, so a plain postgres image would fail to migrate.
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: make test-integration
        env:
          ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas_dev_password@127.0.0.1:5432/atlas?sslmode=disable

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make web-install
      - run: make web-check
      - run: make web-build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - uses: actions/checkout@v4

      # Building the image on every change is what keeps the Dockerfile from
      # rotting quietly until the day someone needs to cut a release.
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION="$(git describe --tags --always --dirty)" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t atlas:ci .

      - name: Verify the binary runs and reports its identity
        run: docker run --rm atlas:ci version
