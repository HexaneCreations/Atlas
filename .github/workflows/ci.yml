  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make web-install
      - run: make web-check
      - run: make web-build

  image:
    name: Container image
    runs-on: ubuntu-latest
    # TEMPORARY: `needs: [verify, test]` removed because those two jobs are
    # commented out above (see their TEMPORARY notes) — GitHub Actions
    # rejects `needs:` referencing a job id that doesn't exist in the file.
    # Restore `needs: [verify, test]` here at the same time those two job
    # blocks get uncommented.
    # Only this job needs to write packages; the rest of the workflow stays
    # read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Building the image on every change is what keeps the Dockerfile from
      # rotting quietly until the day someone needs to cut a release.
      - name: Compute build metadata
        id: build_meta
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "buildtime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.build_meta.outputs.version }}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILDTIME="${{ steps.build_meta.outputs.buildtime }}" \
            -t atlas:ci .

      - name: Verify the binary runs and reports its identity
        run: docker run --rm atlas:ci version

      - name: Build UI image
        run: docker build -t atlas-ui:ci -f web/Dockerfile web

      - uses: docker/setup-buildx-action@v3

      # PRs never push: GITHUB_TOKEN on a PR run is read-only by default and
      # this keeps registry writes limited to commits that landed on main or
      # a release tag.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> sha-<commit> + edge (mutable, never deployed to production).
      # a pushed vX.Y.Z tag -> that exact version + stable (what production
      # pins to). Any other ref (PRs) computes no tags, so the push steps
      # below push nothing.
      - name: Compute image tags
        id: tags
        run: |
          REPO_SERVER=ghcr.io/hexanecreations/atlas-server
          REPO_UI=ghcr.io/hexanecreations/atlas-ui
          TAGS=()
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS+=("sha-${GITHUB_SHA}" "edge")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS+=("${GITHUB_REF#refs/tags/}" "stable")
          fi
          {
            echo "server_tags<<EOF"
            for t in "${TAGS[@]}"; do echo "${REPO_SERVER}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ui_tags<<EOF"
            for t in "${TAGS[@]}"; do echo "${REPO_UI}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "push=$([[ ${#TAGS[@]} -gt 0 && "${{ github.event_name }}" != "pull_request" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build and push atlas-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.server_tags }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ steps.build_meta.outputs.buildtime }}

      - name: Build and push atlas-ui
        uses: docker/build-push-action@v6
        with:
          context: web
          file: ./web/Dockerfile
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.ui_tags }}

  # Only ever runs for a pushed vX.Y.Z tag (never for main/edge) — production
  # always deploys an explicit, immutable release tag, matching the "image"
  # job's own "production uses explicit release tags" convention above.
  #
  # No repository clone lives on the production server: this job checks out
  # the tag on the RUNNER and copies only docker-compose.prod.yml over —
  # /root/atlas/.env.prod and secrets/atlas_db_password.txt are never
  # git-tracked there, generated fresh by this job every deploy instead.
  #
  # The GitHub "production" Environment is the single source of truth for
  # the whole production configuration: every non-secret ATLAS_* value is a
  # production Environment Variable (Settings > Environments > production >
  # Variables), read here via the `vars` context; ATLAS_DATABASE_PASSWORD
  # and the deploy credentials are production Environment Secrets. There is
  # no manually-maintained .env.prod on the server anymore — changing
  # config means changing the Environment Variable, not editing a file.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Ensure /root/atlas exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: mkdir -p /root/atlas/secrets

      # Only docker-compose.prod.yml — .env.prod and secrets/ are never
      # sourced from the repository (see the job comment above).
      - name: Copy docker-compose.prod.yml to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /root/atlas
          strip_components: 0

      - name: Configure and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /root/atlas
            umask 077

            # Regenerated every deploy from the production Environment's
            # Variables — .env.prod is no longer hand-maintained on the
            # server. ATLAS_DATABASE_PASSWORD is deliberately NOT written
            # here: atlas-server reads the password via
            # ATLAS_DATABASE_PASSWORD_FILE (set below by docker-compose.prod
            # .yml's own environment: block, pointing at the secret written
            # next), so a second, plaintext copy of it in this file would be
            # redundant and strictly less safe.
            cat > .env.prod <<ENVEOF
            ATLAS_ENVIRONMENT=${{ vars.ATLAS_ENVIRONMENT }}
            ATLAS_DATABASE_HOST=${{ vars.ATLAS_DATABASE_HOST }}
            ATLAS_DATABASE_PORT=${{ vars.ATLAS_DATABASE_PORT }}
            ATLAS_DATABASE_NAME=${{ vars.ATLAS_DATABASE_NAME }}
            ATLAS_DATABASE_USER=${{ vars.ATLAS_DATABASE_USER }}
            ATLAS_DATABASE_SSL_MODE=${{ vars.ATLAS_DATABASE_SSL_MODE }}
            ATLAS_DATABASE_MIGRATE_ON_START=${{ vars.ATLAS_DATABASE_MIGRATE_ON_START }}
            ATLAS_FLEET_ENABLED=${{ vars.ATLAS_FLEET_ENABLED }}
            ATLAS_FLEET_DATA_DIR=${{ vars.ATLAS_FLEET_DATA_DIR }}
            ATLAS_FLEET_LIBP2P_ENABLED=${{ vars.ATLAS_FLEET_LIBP2P_ENABLED }}
            ATLAS_FLEET_LIBP2P_LISTEN_ADDRS=${{ vars.ATLAS_FLEET_LIBP2P_LISTEN_ADDRS }}
            ATLAS_FLEET_LIBP2P_RELAY_ADDR=${{ vars.ATLAS_FLEET_LIBP2P_RELAY_ADDR }}
            ATLAS_PUBLIC_HOSTNAME=${{ vars.ATLAS_PUBLIC_HOSTNAME }}
            ENVEOF

            # The one credential this workflow writes to disk; .env.prod's
            # own ATLAS_DATABASE_PASSWORD_FILE (baked into docker-compose.
            # prod.yml) points here.
            printf '%s' "${{ secrets.ATLAS_DATABASE_PASSWORD }}" > secrets/atlas_db_password.txt

            # github.repository_owner, not a hardcoded name — GHCR accepts
            # any username paired with a valid token, so this only needs to
            # be a correct identity, not match the (lowercase-only) image
            # path below.
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            export ATLAS_SERVER_IMAGE=ghcr.io/hexanecreations/atlas-server:${{ github.ref_name }}
            export ATLAS_UI_IMAGE=ghcr.io/hexanecreations/atlas-ui:${{ github.ref_name }}

            docker compose -f docker-compose.prod.yml pull

            # docker-compose.prod.yml bind-mounts secrets/atlas_db_password.txt
            # into atlas-server at /run/secrets/atlas_db_password as-is (plain
            # `docker compose` secrets, unlike Swarm, do not re-own/re-mode
            # the file) — it must already be readable by the "atlas" user the
            # container runs as. That UID/GID lives only in the image's own
            # /etc/passwd (Dockerfile's `adduser -u 10001 ... atlas`) and is
            # never hardcoded here, so it's read straight out of the exact
            # image just pulled, not assumed, and stays correct if the image
            # ever changes it. No shell is needed inside the (scratch) image
            # for this — docker cp reads its filesystem without running it.
            ATLAS_PASSWD_CID=$(docker create "$ATLAS_SERVER_IMAGE")
            docker cp "$ATLAS_PASSWD_CID:/etc/passwd" /tmp/atlas_server_passwd
            docker rm "$ATLAS_PASSWD_CID" >/dev/null

            ATLAS_UID=$(grep '^atlas:' /tmp/atlas_server_passwd | cut -d: -f3)
            ATLAS_GID=$(grep '^atlas:' /tmp/atlas_server_passwd | cut -d: -f4)
            rm -f /tmp/atlas_server_passwd

            if [ -z "$ATLAS_UID" ] || [ -z "$ATLAS_GID" ]; then
              echo "could not determine the atlas user's UID/GID from $ATLAS_SERVER_IMAGE's /etc/passwd" >&2
              exit 1
            fi

            chown "$ATLAS_UID:$ATLAS_GID" secrets/atlas_db_password.txt
            chmod 0400 secrets/atlas_db_password.txt

            # Confirms the file is actually owned by the UID/GID the
            # container will read it as, rather than assuming chown worked.
            ACTUAL_OWNER=$(stat -c '%u:%g' secrets/atlas_db_password.txt)
            if [ "$ACTUAL_OWNER" != "$ATLAS_UID:$ATLAS_GID" ]; then
              echo "secrets/atlas_db_password.txt is owned by $ACTUAL_OWNER, expected $ATLAS_UID:$ATLAS_GID" >&2
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d
