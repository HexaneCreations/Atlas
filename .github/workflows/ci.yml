name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push supersedes an in-flight run on the same ref; there is no value in
# testing a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: the Go release that CI validates must be the
  # one developers and the Dockerfile use, or CI stops being evidence.
  GO_VERSION: "1.25"

permissions:
  contents: read

