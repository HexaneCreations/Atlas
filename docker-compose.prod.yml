# Atlas — production Compose stack.
#
# Companion to docker-compose.yml (development-only Postgres — untouched by
# this file). This is for `docker compose -f docker-compose.prod.yml up -d`
# on the production host, and for CI/CD to `pull` and `up` a released image —
# see docs/operations/deployment.md, which this follows directly.
#
# PostgreSQL runs as the `postgres` service below, on atlas-internal only —
# never published to the host (see its "ports"/"expose" notes). ATLAS_
# DATABASE_HOST (in .env.prod) points at it by its Compose DNS name,
# "postgres". An external/managed instance remains a valid alternative;
# point ATLAS_DATABASE_HOST at it instead and drop the postgres service.
#
# This IS the Fleet control plane: Fleet/libp2p are enabled via .env.prod,
# reaching Atlas Relay entirely by dialing out (see the atlas-server service
# below for why no Fleet port is published here).
#
# Variable substitution and the atlas-server container environment both come
# from one file, passed explicitly so this never picks up the development
# .env that docker-compose.yml uses:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod config
#
# See .env.prod.example for what that file needs.

name: atlas-prod

services:
  # A fresh named volume is created root:root 0755 by Docker — verified
  # directly: atlas-server (uid 10001, all capabilities dropped, per the
  # hardening below) cannot write into one at all, which would silently break
  # Fleet's very first CA write. Baking ownership into the image doesn't work
  # either — also verified: Docker's volume-seed-from-image only copies file
  # contents, not an empty directory's own ownership. One root, capable
  # container fixes ownership once and exits; atlas-server never runs as
  # root or gains a capability it doesn't already have.
  atlas-fleet-volume-init:
    image: alpine:3.21
    container_name: atlas-fleet-volume-init
    command: ["chown", "10001:10001", "/fleet-data"]
    volumes:
      - atlas-fleet-data:/fleet-data
    restart: "no"
    # A chown needs no network at all.
    network_mode: none

  postgres:
    # migrations/0001_extensions.sql runs `CREATE EXTENSION IF NOT EXISTS
    # timescaledb`, a hard requirement (docs/adr/0003-postgresql-
    # timescaledb-datastore.md) that plain postgres images don't ship. Same
    # tag docker-compose.yml (development) and .github/workflows/ci.yml
    # already pin, so this is not a second, drifting choice of version.
    image: timescale/timescaledb:2.17.2-pg17
    # Distinct from docker-compose.yml's (development) container_name and
    # volume name — both are "atlas-postgres"/"atlas-postgres-data" there
    # too, and Docker's container/volume namespace is global to the host, so
    # running both stacks side by side collides otherwise.
    container_name: atlas-postgres-prod
    restart: unless-stopped
    # Atlas's own config validation (internal/platform/config/validate.go)
    # refuses anything but verify-ca/verify-full in production, and Atlas has
    # no custom-CA option (system trust store only) — so this server must
    # actually terminate TLS with a certificate atlas-server can validate.
    # ./postgres-certs (server.crt/server.key, CN/SAN "postgres") is
    # generated once by the deploy workflow, signed by an internal CA that
    # workflow also mounts into atlas-server's trust bundle below.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      # Sourced from the same secret atlas-server already authenticates
      # with (see atlas-server's ATLAS_DATABASE_PASSWORD_FILE below) rather
      # than a literal POSTGRES_PASSWORD, so the password is never written
      # into this tracked file and the two services can never drift apart.
      POSTGRES_PASSWORD_FILE: /run/secrets/atlas_db_password
      # Avoids initdb failing on a fresh volume whose root already contains
      # filesystem metadata (e.g. lost+found on some Linux/ext4 hosts) — a
      # documented caveat of mounting a volume directly at the Postgres
      # image's default PGDATA.
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - atlas_db_password
    networks:
      - atlas-internal
    # Not published — see docker-compose.prod.yml's header comment. Only
    # reachable from other atlas-internal services, by "postgres:5432".
    expose:
      - "5432"
    volumes:
      - atlas-postgres-data-prod:/var/lib/postgresql/data
      # Host directory (not a named volume): the deploy workflow generates
      # and chowns these files directly with plain shell commands, the same
      # way it already manages secrets/atlas_db_password.txt. Postgres
      # itself requires server.key be owned by the exact UID it runs
      # as and mode 0600, hence :ro here but not on the workflow side.
      - ./postgres-certs:/etc/postgresql/certs:ro
    cap_drop:
      - ALL
    # The official image's entrypoint runs as root first to chown/chmod
    # PGDATA and /var/run/postgresql, then setuid/setgid down to the
    # "postgres" user before the server itself starts — verified: a bare
    # `cap_drop: ALL` fails both the chown and the chmod with "Operation not
    # permitted". Same category of fix as atlas-ui's own cap_add, for nginx.
    #
    # DAC_OVERRIDE: docker_setup_env (which resolves POSTGRES_PASSWORD_FILE)
    # runs before the gosu re-exec to "postgres", so that read happens as
    # root while still on this reduced capability set — without
    # DAC_OVERRIDE, root here is bound by normal file permission bits like
    # any other UID and can't read a secret owned by a different UID/GID,
    # verified directly: the entrypoint fails at that exact read with
    # `/run/secrets/atlas_db_password: Permission denied`. Only matters for
    # this brief root phase — Linux drops capabilities on gosu's non-root
    # setuid, so the postgres process itself never actually runs with it.
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  atlas-server:
    # ATLAS_SERVER_IMAGE lets CI/CD point at a registry tag; unset, this
    # builds from the same production Dockerfile the image target already
    # verifies in CI (see .github/workflows/ci.yml) — `docker compose build`
    # gives a working local production image with no registry involved.
    image: ${ATLAS_SERVER_IMAGE:-atlas-server:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${ATLAS_VERSION:-dev}
    container_name: atlas-server
    restart: unless-stopped
    depends_on:
      atlas-fleet-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # ATLAS_ENV_FILE lets `config`/`build` be validated against
    # .env.prod.example alone, with no real .env.prod ever created — see the
    # report's "Validation results":
    #   ATLAS_ENV_FILE=.env.prod.example docker compose --env-file .env.prod.example -f docker-compose.prod.yml config
    # Real usage is unaffected: --env-file .env.prod leaves this at its
    # default, which is the same file.
    env_file:
      - ${ATLAS_ENV_FILE:-.env.prod}
    secrets:
      - atlas_db_password
    environment:
      # The one value that must point at *this* stack rather than being a
      # free-form setting: the file path Compose actually mounts the secret
      # at. Everything else Atlas needs comes from .env.prod via env_file.
      ATLAS_DATABASE_PASSWORD_FILE: /run/secrets/atlas_db_password
    networks:
      - atlas-internal
    # Not published: atlas-ui is the public entry point and reaches this
    # service by its Compose DNS name (see web/nginx.conf's upstream). See
    # "Ports"/"Networks" in the report for why this differs from
    # docs/operations/deployment.md's standalone `docker run` example, which
    # has no reverse proxy in front of it to delegate to.
    #
    # Fleet/libp2p (4102) is now also published directly to the host, on top
    # of 8080 staying internal-only — see internal/app/fleet.go's Start():
    # when ATLAS_FLEET_LIBP2P_RELAY_ADDR is set, the control plane still
    # dials out to Atlas Relay and reserves a circuit regardless, so the
    # relay path keeps working unchanged; this port is published in addition
    # to that, for an external Agent to reach 139.84.153.127:4102 directly
    # instead of only through the relay. UFW on the host already allows
    # 4102/tcp. This is the "deliberate networking decision to make then,
    # not a default" that comment used to describe — this is that decision.
    expose:
      - "8080"
    ports:
      - "4102:4102"
    volumes:
      # Fleet's CA and the server's own leaf certificate live under
      # ATLAS_FLEET_DATA_DIR (see internal/platform/pki.LoadOrCreateCA,
      # called from internal/app/fleet.go's Start()) — this is the trust
      # root every enrolled agent already validated against. Losing it
      # forces every agent to re-enroll; a named volume, not an anonymous
      # one, is what survives `down`/`up` and any container recreation. The
      # mount path is driven by the same variable Atlas itself reads, so
      # they can never drift apart.
      - atlas-fleet-data:${ATLAS_FLEET_DATA_DIR:-/var/lib/atlas/fleet}
      # Atlas has no custom-CA config (internal/platform/config has no
      # sslrootcert-equivalent field) — verify-full against postgres's
      # internal CA (see the postgres service's own comment) only works by
      # replacing the image's own public-CA bundle with one that also
      # includes it. The deploy workflow regenerates this file every deploy
      # (image's bundle + the persisted internal CA), so it can't go stale
      # if a future atlas-server image updates its base public-CA bundle.
      # Public CA data, not a secret — 0444 is intentional.
      - ./postgres-certs/combined-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No Docker healthcheck: the runtime image is scratch (see Dockerfile) —
    # no shell, no curl, nothing a CMD-SHELL probe could exec. Health is the
    # HTTP probes at /healthz and /readyz, exactly as
    # docs/operations/deployment.md's Kubernetes example uses them; here,
    # the front door for those checks is atlas-ui's reverse proxy or an
    # external monitor, not Docker itself.

  atlas-ui:
    image: ${ATLAS_UI_IMAGE:-atlas-ui:local}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: atlas-ui
    restart: unless-stopped
    networks:
      - atlas-internal
    # Published to loopback only: an existing host/system Caddy (managed
    # outside this Compose stack) is the public entry point and reverse-
    # proxies to 127.0.0.1:8081, satisfying docs/operations/deployment.md's
    # "an authenticating reverse proxy is mandatory in front of Atlas"
    # requirement without a Caddy container in this stack.
    ports:
      - "127.0.0.1:8081:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    # nginx's own startup (root, before workers drop to the nginx user) needs
    # these three to own and use the tmpfs mounts above — verified: with a
    # bare `cap_drop: ALL` it fails startup with
    # `chown("/var/cache/nginx/client_temp", 101) failed (1: Operation not
    # permitted)`, even running as root, because ALL includes CAP_CHOWN.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # nginx:alpine has a shell and wget, unlike the atlas-server image —
      # this one can actually run.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - atlas-server

networks:
  atlas-internal:
    driver: bridge

volumes:
  atlas-fleet-data:
    name: atlas-fleet-data
  atlas-postgres-data-prod:
    name: atlas-postgres-data-prod

secrets:
  # File-based, matching docs/operations/deployment.md's
  # ATLAS_DATABASE_PASSWORD_FILE example exactly — see .env.prod.example and
  # the report for how to create this file; it must never be committed.
  atlas_db_password:
    file: ${ATLAS_DB_PASSWORD_FILE:-./secrets/atlas_db_password.txt}
