# Serves the built Atlas UI and proxies API/WebSocket traffic to
# atlas-server, mirroring vite.config.ts's dev proxy so the frontend makes
# the exact same same-origin requests in production as in development — no
# separate API base URL, no CORS.
#
# "atlas-server:8080" is the Compose service name and ATLAS_SERVER_PORT
# default from docker-compose.prod.yml / Dockerfile; both are fixed by this
# repo's own convention, not runtime configuration.

# Only the WebSocket upgrade request itself should carry "Connection:
# upgrade" — a plain proxied GET/POST must not, or keepalive breaks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker Compose's embedded DNS server. Required so
    # proxy_pass below resolves "atlas-server" per-request via a variable
    # instead of once at nginx startup — without this, nginx refuses to
    # start at all if atlas-server's name isn't resolvable at that exact
    # moment (verified: a plain hostname in proxy_pass does exactly this),
    # which would crash-loop the UI on any startup-order or restart timing.
    resolver 127.0.0.11 valid=30s;

    # React Router (BrowserRouter): any path not matching a real file falls
    # back to index.html, which then resolves the route client-side.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        set $atlas_server atlas-server:8080;
        proxy_pass http://$atlas_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Container log follow (and any future stream) upgrades to a
        # WebSocket on this same path — see internal/api/v1/containers.go's
        # ContainerLogsFollow and web/src/api/logFollow.ts.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /healthz {
        set $atlas_server atlas-server:8080;
        proxy_pass http://$atlas_server/healthz;
    }

    location = /readyz {
        set $atlas_server atlas-server:8080;
        proxy_pass http://$atlas_server/readyz;
    }
}
